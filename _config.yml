title: Game Design Lab
tagline: 面白さを、分解して学ぶ。
description: 名作ゲームの仕組みを、遊べるデモで分解する。1日10分、ゲームプランナーの入門ノート。
lang: ja

# GitHub Pages のプロジェクトサイト（https://<ユーザー名>.github.io/<リポジトリ名>/）では
# baseurl をリポジトリ名に合わせる。独自ドメインやユーザーサイトなら "" にする。
baseurl: "/game-design-lab"
url: ""

collections:
  lessons:
    output: true
    permalink: /lessons/:name/

defaults:
  - scope:
      path: ""
      type: lessons
    values:
      layout: lesson

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - docs/
  - Gemfile
  - Gemfile.lock
  - vendor/
