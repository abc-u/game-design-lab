<section class="panel game-card" id="game"><div class="between" style="margin-top:0"><h2 style="margin:0">💎 深層の宝石</h2><span id="round" class="tag">1 / 5 ラウンド</span></div><p class="small">「進む」で宝石を獲得。失敗すると手持ち分だけ失う。「帰る」で手持ちを確定。5ラウンドの合計を競おう。</p><div class="cave" aria-hidden="true">🕳️</div><div class="stats"><div class="stat"><strong id="bank">0</strong><small>確定得点</small></div><div class="stat"><strong id="held">0</strong><small>手持ち</small></div><div class="stat"><strong id="depth">0</strong><small>深さ</small></div></div><div class="between"><span>次の一歩の失敗率</span><strong id="risk">10%</strong></div><div class="meter" role="progressbar" aria-label="失敗率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="10" id="riskmeter"><div class="fill" id="riskfill" style="width:10%"></div></div><div class="message" role="status" aria-live="polite" id="message">新しい探検が始まりました。進むか、帰るか選んでください。</div><div class="actions"><button id="advance">さらに進む +4</button><button id="return" class="secondary">帰る・確定</button></div><button id="restart" class="secondary" style="width:100%;margin-top:10px">最初からやり直す</button></section>
<section class="panel lab-card" id="lab"><h2>🧪 ルール改造ラボ</h2><p>数値を変えてもう一度プレイ。<strong>コード編集なしでも</strong>ゲームバランスを比較できる。</p><div class="controls"><div class="control"><label for="reward">一歩の宝石報酬 <output id="rewardOut">4 個</output></label><input id="reward" type="range" min="1" max="15" step="1" value="4"></div><div class="control"><label for="initial">最初の失敗率 <output id="initialOut">10%</output></label><input id="initial" type="range" min="0" max="60" step="5" value="10"></div><div class="control"><label for="increase">一歩ごとの失敗率上昇 <output id="increaseOut">10%</output></label><input id="increase" type="range" min="0" max="30" step="5" value="10"></div></div><p class="small">設定は次のラウンドから反映されます。すぐ試したい場合は「最初からやり直す」を押してください。</p><h3>結果を比較する</h3><div class="compare"><div class="tile"><span class="small">前回の最終得点</span><b id="previous">—</b></div><div class="tile"><span class="small">直近の最終得点</span><b id="latest">—</b></div></div><p class="small">得点は運にも左右されます。1回だけで結論を出さず、同じ設定を数回試しましょう。</p></section>


</article></main>
<script>
'use strict';
// 学習者向け：まずはここの数値を編集してみよう
const DEFAULTS = {reward:4, initial:10, increase:10};
const $ = id => document.getElementById(id);
const state = {round:1,bank:0,held:0,depth:0,risk:10,done:false,previous:null,latest:null};
const settings = () => ({reward:+$('reward').value, initial:+$('initial').value, increase:+$('increase').value});
function show(msg){$('round').textContent=state.round+' / 5 ラウンド';$('bank').textContent=state.bank;$('held').textContent=state.held;$('depth').textContent=state.depth;$('risk').textContent=state.risk+'%';$('riskfill').style.width=state.risk+'%';$('riskmeter').setAttribute('aria-valuenow',state.risk);$('message').textContent=msg;$('advance').disabled=state.done;$('return').disabled=state.done;$('advance').textContent='さらに進む +'+settings().reward;$('previous').textContent=state.previous===null?'—':state.previous;$('latest').textContent=state.latest===null?'—':state.latest;}
function endRound(msg){if(state.round>=5){state.done=true;state.previous=state.latest;state.latest=state.bank;show(msg+' 全5ラウンド終了！ 最終得点は'+state.bank+'点。');return;}state.round++;state.held=0;state.depth=0;state.risk=settings().initial;show(msg+' 次のラウンドへ。');}
function advance(){if(state.done)return; if(Math.random()*100<state.risk){const lost=state.held;endRound('落盤！ 宝石'+lost+'個を失いました。');}else{state.held+=settings().reward;state.depth++;state.risk=Math.min(95,state.risk+settings().increase);show('成功！ 手持ちは'+state.held+'個。ここで帰れば確保できます。');}}
function bankNow(){if(state.done)return;const gain=state.held;state.bank+=gain;endRound(gain+'個の宝石を無事に持ち帰りました。');}
function reset(){state.round=1;state.bank=0;state.held=0;state.depth=0;state.risk=settings().initial;state.done=false;show('新しい探検が始まりました。進むか、帰るか選んでください。');}

$('advance').addEventListener('click',advance);$('return').addEventListener('click',bankNow);$('restart').addEventListener('click',reset);
for(const name of ['reward','initial','increase']){$(name).value=DEFAULTS[name];$(name).addEventListener('input',()=>{$(name+'Out').textContent=$(name).value+(name==='reward'?' 個':'%');show($('message').textContent);});}
const downloadButton=$('download');if(downloadButton)downloadButton.addEventListener('click',()=>{try{const doc=document.documentElement.cloneNode(true),main=doc.querySelector('main'),article=doc.querySelector('article');main.querySelector('header')?.remove();main.querySelector('.breadcrumb')?.remove();for(const child of [...article.children])if(!['game','lab'].includes(child.id))child.remove();const title=doc.querySelector('title');if(title)title.textContent='DAY 01 Demo｜深層の宝石';const desc=doc.querySelector('meta[name=description]');if(desc)desc.setAttribute('content','深層の宝石。リスクとリターンを実験するオリジナルゲームデモです。');doc.querySelector('link[rel=canonical]')?.remove();const html='<!doctype html>\n'+doc.outerHTML;const blob=new Blob([html],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='GameDesignLab_Day001_2026-10-21.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);$('downloadNote').textContent='デモのみのHTMLをダウンロードしました。ゲームとルール改造はオフラインでも動作します。';}catch(e){$('downloadNote').textContent='ダウンロードできませんでした。Safariの共有メニューをご確認ください。'}});
reset();
</script><iframe height="1" width="1" style="position: absolute; top: 0px; left: 0px; border: none; visibility: hidden;"></iframe>
