<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7faf5"><title>きょうの小さな農場｜Game Design Lab DAY 05</title><style>
:root{color-scheme:light;--ink:#26332a;--muted:#657168;--line:#dce5dc;--green:#49785b;--soft:#f3f7f1;--soil:#8a6244;--gold:#b18a3b}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}main{max-width:670px;margin:auto;padding:14px 14px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.kicker{font-size:11px;letter-spacing:.06em;color:var(--green);font-weight:750}.day{font-size:12px;color:var(--muted)}h1{font-size:23px;line-height:1.25;margin:2px 0 4px}.desc{font-size:13px;color:var(--muted);margin:0 0 10px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.pill{border:1px solid var(--line);border-radius:99px;padding:4px 9px;background:#fff;font-size:12px}.pill b{color:var(--green)}.banner{min-height:42px;padding:8px 10px;border-radius:6px;border:1px solid #d9e7d7;background:#f4f8f1;color:#354a3a;font-size:13px;margin:8px 0}.goalrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.goalrow label,.actionrow label{font-size:12px;font-weight:700;display:block;margin-bottom:3px}.goalrow select,.actionrow select{width:100%;min-height:42px;border:1px solid #cbd8cb;border-radius:6px;background:white;padding:7px 9px;color:var(--ink);font:inherit;font-size:14px}.target{font-size:12px;color:var(--muted);padding:0 2px 8px;white-space:nowrap}.field{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}.plot{border:1px solid #d4dfd1;background:linear-gradient(#edf4e8,#e6efdf);min-height:84px;border-radius:7px;padding:7px 5px;text-align:center;position:relative;cursor:pointer;touch-action:manipulation;transition:transform .08s,box-shadow .08s}.plot:active{transform:scale(.97)}.plot.selected{outline:3px solid #85a98a;outline-offset:1px}.plot.empty{background:linear-gradient(#f6f0e5,#ede2d1)}.crop{font-size:26px;line-height:1.1;display:block}.plot small{display:block;font-size:10px;color:#4d5d4e;line-height:1.25}.plot .status{position:absolute;right:4px;top:2px;font-size:10px}.actionrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.button{border:1px solid var(--green);border-radius:6px;min-height:44px;padding:8px 10px;background:var(--green);color:white;font:inherit;font-size:14px;font-weight:700;cursor:pointer;touch-action:manipulation}.button.secondary{background:white;color:var(--ink);border-color:#cbd8cb}.button:disabled{opacity:.48;cursor:default}.lab{margin-top:13px;border:1px solid var(--line);border-radius:7px;padding:10px 11px;background:#fbfcfa}.lab summary{font-weight:750;cursor:pointer}.labgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 13px;margin-top:10px}.control label{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:650}.control output{color:var(--green);font-weight:750}input[type=range]{width:100%;accent-color:var(--green);min-height:30px;margin:4px 0}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.compare>div{border:1px solid var(--line);border-radius:6px;background:white;padding:8px 9px;min-height:52px}.compare strong{font-size:11px;color:var(--muted);display:block}.compare span{font-size:13px}.codehint{border-top:1px solid var(--line);margin-top:9px;padding-top:8px;color:var(--muted);font-size:11px}.codehint code{font-size:11px;background:#edf2ec;padding:2px 4px;border-radius:3px}.result{margin-top:10px;padding:11px;border:1px solid #eadfbe;background:#fbf8ee;border-radius:7px;display:none}.result h2{font-size:16px;margin:0 0 4px}.result p{margin:4px 0;font-size:13px}.foot{font-size:10px;color:var(--muted);margin-top:9px}@media(max-width:400px){main{padding:11px 10px}.plot{min-height:78px;padding:6px 3px}.crop{font-size:23px}.field{gap:6px}.bar{gap:5px}.pill{font-size:11px;padding:4px 7px}.labgrid{grid-template-columns:1fr}.goalrow{grid-template-columns:1fr auto}}
</style></head><body><main><div class="top"><div class="kicker">GAME DESIGN LAB · DAY 05</div><div class="day">1プレイ約1〜2分</div></div><h1>きょうの小さな農場</h1><p class="desc">5日間の行動を計画して、自分の目標を達成しよう。畑をタップして行動します。</p><div class="bar"><span class="pill">日 <b id="day">1</b> / 5</span><span class="pill">行動 <b id="energy">4</b></span><span class="pill">コイン <b id="coins">0</b></span><span class="pill">収穫 <b id="harvests">0</b></span></div><div class="goalrow"><div><label for="goal">今回の目標</label><select id="goal"><option value="coin">出荷箱：コインをためる</option><option value="harvest">食卓：たくさん収穫する</option><option value="variety">彩り：2種類を育てて収穫</option></select></div><div class="target" id="target">目標 180コイン</div></div><div class="banner" id="message" aria-live="polite">畑をタップして選択。空き畑に種を植え、毎日水をあげよう。</div><div class="field" id="field" aria-label="3行3列の畑"></div><div class="actionrow"><div><label for="tool">畑で行うこと</label><select id="tool"><option value="auto">畑に合わせる</option><option value="plant_turnip">カブの種を植える（1回）</option><option value="plant_pumpkin">カボチャの種を植える（1回）</option><option value="water">水をやる（1回）</option><option value="harvest">収穫する（1回）</option></select></div><div class="btns"><button class="button" id="doAction">畑に行動</button><button class="button secondary" id="endDay">一日を終える</button></div></div><details class="lab"><summary>実験室｜ルールを変えて再プレイ</summary><div class="labgrid"><div class="control"><label for="actions">一日の行動回数 <output id="actionsOut">4</output></label><input id="actions" type="range" min="3" max="6" step="1" value="4"></div><div class="control"><label for="growth">成長に必要な水やり日数 <output id="growthOut">2</output></label><input id="growth" type="range" min="1" max="3" step="1" value="2"></div><div class="control"><label for="reward">出荷価格 <output id="rewardOut">×1.0</output></label><input id="reward" type="range" min="0.6" max="1.6" step="0.2" value="1"></div></div><div class="compare"><div><strong>前回の結果</strong><span id="previous">まだありません</span></div><div><strong>現在の設定</strong><span id="settings">行動4回・水やり2日・価格×1.0</span></div></div><div class="codehint">改造ポイント：コード内の <code>RULES</code> が日々の行動数・成長段階・出荷価格、<code>GOALS</code> が目標条件です。</div></details><div class="result" id="result" aria-live="polite"><h2 id="resultTitle"></h2><p id="resultText"></p><button class="button" id="replay">同じ設定でもう一度</button></div><div class="foot">このデモはオリジナル作品です。作物・コイン・演出は学習用の抽象表現です。</div></main><script>
'use strict';
// 改造ポイント1：このオブジェクトの値を変えると、ゲームの判断圧と報酬ペースが変わります。
const RULES={days:5,actionsPerDay:4,growthDays:2,priceMultiplier:1};
// 改造ポイント2：目標条件を増やす・変えることで、「何を達成とするか」を再設計できます。
const GOALS={coin:{label:'出荷箱',target:180,check:s=>s.coins>=180},harvest:{label:'食卓',target:4,check:s=>s.harvests>=4},variety:{label:'彩り',target:'カブとカボチャ',check:s=>s.harvestedKinds.has('turnip')&&s.harvestedKinds.has('pumpkin')}};
const CROPS={turnip:{name:'カブ',emoji:'🥕',price:35},pumpkin:{name:'カボチャ',emoji:'🎃',price:90}};
const $=id=>document.getElementById(id);let state,selected=0,previousResult=null;
function freshState(){return {day:1,energy:RULES.actionsPerDay,coins:0,harvests:0,plots:Array.from({length:9},()=>null),harvestedKinds:new Set(),over:false,goal:$('goal').value}}
function say(s){$('message').textContent=s}
function render(){ $('day').textContent=state.day;$('energy').textContent=state.energy;$('coins').textContent=state.coins;$('harvests').textContent=state.harvests;const field=$('field');field.replaceChildren();state.plots.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='plot '+(p?'':'empty')+(i===selected?' selected':'');b.setAttribute('aria-label',p?`${i+1}番畑 ${CROPS[p.kind].name} 成長${p.growth}/${RULES.growthDays}${p.watered?' 水やり済み':''}`:`${i+1}番畑 空き`);b.innerHTML=p?`<span class="status">${p.watered?'💧':''}</span><span class="crop">${p.growth>=RULES.growthDays?'✨':CROPS[p.kind].emoji}</span><small>${CROPS[p.kind].name} ${p.growth>=RULES.growthDays?'収穫OK':`成長 ${p.growth}/${RULES.growthDays}`}</small>`:`<span class="crop">🟫</span><small>空き畑</small>`;b.addEventListener('click',()=>{selected=i;render()});field.append(b)});const goal=GOALS[state.goal];$('target').textContent=typeof goal.target==='number'?`目標 ${goal.target}${state.goal==='coin'?'コイン':'回'}`:`目標 ${goal.target}`;$('doAction').disabled=state.over||state.energy<=0;$('endDay').disabled=state.over;}
function spend(){if(state.energy<=0){say('今日の行動を使い切った。一日を終えて次の計画へ。');return false}state.energy--;return true}
function act(){if(state.over)return;const p=state.plots[selected],tool=$('tool').value;let mode=tool;if(mode==='auto')mode=!p?'plant_turnip':p.growth>=RULES.growthDays?'harvest':p.watered?'water':'water';if(mode.startsWith('plant_')){if(p){say('この畑には作物がある。別の空き畑を選んで。');return}if(!spend())return;const kind=mode==='plant_pumpkin'?'pumpkin':'turnip';state.plots[selected]={kind,growth:0,watered:false};say(`${CROPS[kind].name}を植えた。毎日水をやると育つよ。`)}else if(mode==='water'){if(!p){say('まず空き畑に種を植えて。');return}if(p.growth>=RULES.growthDays){say('もう育っている。収穫して次の計画へ。');return}if(p.watered){say('今日はもう水をあげた。別の畑か、次の日を選ぼう。');return}if(!spend())return;p.watered=true;say(`${CROPS[p.kind].name}に水をあげた。今日の終わりに成長する。`)}else if(mode==='harvest'){if(!p||p.growth<RULES.growthDays){say('まだ収穫できない。成長段階を確認して水をあげよう。');return}if(!spend())return;const crop=CROPS[p.kind],earned=Math.round(crop.price*RULES.priceMultiplier);state.coins+=earned;state.harvests++;state.harvestedKinds.add(p.kind);state.plots[selected]=null;say(`${crop.name}を出荷。${earned}コイン獲得！`);checkGoal()}render()}
function checkGoal(){if(GOALS[state.goal].check(state)){finish(true);return true}return false}
function endDay(){if(state.over)return;state.plots.forEach(p=>{if(p){if(p.watered)p.growth=Math.min(RULES.growthDays,p.growth+1);p.watered=false}});if(state.day>=RULES.days){state.day=RULES.days;finish(GOALS[state.goal].check(state));render();return}state.day++;state.energy=RULES.actionsPerDay;say(`朝になった。今日の行動は${RULES.actionsPerDay}回。畑の状態を見て計画しよう。`);render()}
function summary(){return `${state.day}日目・${state.coins}コイン・収穫${state.harvests}回・目標${GOALS[state.goal].label}`}
function finish(won){state.over=true;const result=$('result');result.style.display='block';$('resultTitle').textContent=won?'目標達成！':'5日間が終わった';$('resultText').textContent=`${summary()}。${won?'自分で決めた目標に届いた。':'どこまで届いたかを見て、目標かルールを変えてみよう。'}`;previousResult=`${won?'達成':'未達'}｜${summary()}`;$('previous').textContent=previousResult;say(won?'目標を達成。設定を変えて、別の遊び方も試そう。':'終了。ルールを調整して、もう一度試そう。');$('replay').focus({preventScroll:true})}
function updateSettings(){RULES.actionsPerDay=Number($('actions').value);RULES.growthDays=Number($('growth').value);RULES.priceMultiplier=Number($('reward').value);$('actionsOut').value=RULES.actionsPerDay;$('growthOut').value=RULES.growthDays;$('rewardOut').value=`×${RULES.priceMultiplier.toFixed(1)}`;$('settings').textContent=`行動${RULES.actionsPerDay}回・水やり${RULES.growthDays}日・価格×${RULES.priceMultiplier.toFixed(1)}`;if(state&&!state.over){state=freshState();selected=0;$('result').style.display='none';say('設定を適用して新しい農場を始めた。前回の結果と比べよう。');render()}}
function replay(){state=freshState();selected=0;$('result').style.display='none';say('新しい5日間が始まった。目標に合わせて畑の計画を立てよう。');render()}
document.querySelectorAll('#actions,#growth,#reward').forEach(el=>el.addEventListener('input',updateSettings));$('goal').addEventListener('change',()=>{if(state&&!state.over){state=freshState();say('目標を変えた。新しい条件で最初から始めよう。');render()}});$('doAction').addEventListener('click',act);$('endDay').addEventListener('click',endDay);$('replay').addEventListener('click',replay);state=freshState();render();
// 埋め込み時は内容の高さを親ページへ伝え、内側スクロールを避けます。
function reportHeight(){if(window.parent!==window)window.parent.postMessage({kind:'GDL_DAY005_HEIGHT',height:document.documentElement.scrollHeight},location.origin)}
new ResizeObserver(reportHeight).observe(document.documentElement);window.addEventListener('load',reportHeight);reportHeight();
</script></body></html>
