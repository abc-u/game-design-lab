<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>予告つき防衛ライン｜Game Design Lab DAY 06</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ee;--ink:#16161a;--accent:#5b3df5;--warn:#d9480f;--line:2px solid #16161a;--shadow:4px 4px 0 #16161a;--pixel:"DotGothic16",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Zen Kaku Gothic New",sans-serif;overflow-x:hidden}
main{max-width:480px;margin:0 auto;padding:14px 14px 20px}
h1{font-family:var(--pixel);font-weight:400;font-size:24px;line-height:1.25;margin:2px 0 4px}
h2{font-family:var(--pixel);font-weight:400;font-size:17px;margin:0 0 4px}
.kicker{font-family:var(--pixel);font-size:13px;color:var(--accent)}
.desc{font-size:13px;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill{border:var(--line);background:#fff;padding:2px 8px;font-size:13px}
.pill b{font-family:var(--pixel);font-weight:400;color:var(--accent);font-size:16px}
.msg{min-height:44px;border:var(--line);background:#fff;padding:6px 10px;font-size:13px;margin:8px 0}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0}
.cell{position:relative;aspect-ratio:1;border:var(--line);background:#fff;padding:0;display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:22px;color:var(--ink);cursor:default;touch-action:manipulation;min-width:0}
.cell.enemy{background:#e9e5ff;cursor:pointer}
.cell.sel{outline:3px solid var(--accent);outline-offset:1px;background:#d8d0ff}
.cell.bld{background:#d9d6cb}
.cell.bld.dead{background:#fff;color:#999;border-style:dashed}
.cell.target::after{content:"";position:absolute;inset:3px;border:3px dashed var(--accent);pointer-events:none}
.cell.hit{animation:flash .5s}
@keyframes flash{0%{background:var(--warn)}100%{}}
.hp{position:absolute;left:3px;bottom:1px;font-size:11px;letter-spacing:1px}
.tele{position:absolute;right:3px;top:0;font-size:15px;color:var(--accent)}
.tele.hid{color:#777}
.mark{position:absolute;right:3px;bottom:1px;font-size:11px;color:var(--accent)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
button.b{font:inherit;font-weight:700;font-size:14px;min-height:46px;border:var(--line);background:#fff;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation;padding:4px}
button.b:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
button.b.main{background:var(--accent);color:#fff}
button.b:disabled{opacity:.4;box-shadow:none;cursor:default}
.end{width:100%;margin-top:6px}
.lab{margin-top:14px;border:var(--line);background:#fff;padding:8px 10px}
.lab summary{font-family:var(--pixel);font-size:16px;cursor:pointer}
.ctl{margin-top:10px}
.ctl label{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.ctl output{font-family:var(--pixel);color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);min-height:30px;margin:2px 0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cmp div{border:var(--line);padding:6px 8px;font-size:12px;min-height:56px}
.cmp strong{display:block;font-family:var(--pixel);font-weight:400;color:var(--accent);font-size:13px}
.hint{font-size:11px;margin-top:8px}
.hint code{background:#e9e5ff;padding:0 3px}
.result{display:none;margin-top:12px;border:var(--line);background:#fff;padding:10px 12px;box-shadow:var(--shadow)}
.result p{margin:4px 0;font-size:13px}
.legend{font-size:12px;margin:2px 0 0}
.foot{font-size:11px;margin-top:10px}
@media(max-width:400px){main{padding:10px}.cell{font-size:19px}h1{font-size:21px}}
</style>
</head>
<body>
<main>
<div class="kicker">GAME DESIGN LAB · DAY 06</div>
<h1>予告つき防衛ライン</h1>
<p class="desc">敵は毎ターン、真下のマスを攻撃する。敵をタップして、押す・撃つで被害を減らそう。1プレイ約2分。</p>

<div class="bar">
  <span class="pill">ターン <b id="turn">1</b>/<span id="turns">6</span></span>
  <span class="pill">行動 <b id="ap">3</b></span>
  <span class="pill">家の耐久 <b id="bhp">10</b></span>
  <span class="pill">撃破 <b id="kills">0</b></span>
</div>
<div class="msg" id="msg" aria-live="polite"></div>
<div class="board" id="board" aria-label="5×5の盤面"></div>
<p class="legend">紫の点線＝敵が次に攻撃するマス　「?」＝予告なし　「ハズレ」はときどき起きる</p>

<div class="btns">
  <button class="b" id="pushL">◀ 押す</button>
  <button class="b" id="shoot">撃つ</button>
  <button class="b" id="pushR">押す ▶</button>
</div>
<button class="b main end" id="endTurn">ターン終了（敵が動く）</button>

<details class="lab" open>
  <summary>実験室｜予告の出し方を変える</summary>
  <div class="ctl"><label for="tele">予告が見える敵の割合 <output id="teleOut"></output></label>
    <input id="tele" type="range" min="0" max="100" step="25"></div>
  <div class="ctl"><label for="actions">1ターンの行動回数 <output id="actionsOut"></output></label>
    <input id="actions" type="range" min="1" max="4" step="1"></div>
  <div class="ctl"><label for="miss">予告がハズレる確率 <output id="missOut"></output></label>
    <input id="miss" type="range" min="0" max="50" step="10"></div>
  <div class="cmp">
    <div><strong>前回の結果</strong><span id="prev">まだありません</span></div>
    <div><strong>今の設定</strong><span id="cur"></span></div>
  </div>
  <p class="hint">改造ポイント：ファイル先頭近くの <code>DEFAULTS</code>。敵の数・耐久・ターン数を変えられます。</p>
</details>

<div class="result" id="result" aria-live="polite">
  <h2 id="rTitle"></h2>
  <p id="rText"></p>
  <button class="b main end" id="again">同じ盤面でもう一度</button>
</div>
<p class="foot">オリジナルの学習用デモです。盤面の並びは毎回同じなので、設定だけを変えて結果を比べられます。</p>
</main>

<script>
'use strict';
// ===== 改造ポイント：初期値はここにまとめています =====
const DEFAULTS = {
  turns: 6,        // ゲームのターン数
  actions: 3,      // 1ターンに使える行動回数（押す・撃つ 各1回）
  spawn: 3,        // 毎ターン、上の列に現れる敵の数
  telegraph: 100,  // 予告が見える敵の割合（%）。0なら攻撃先は見えない
  miss: 0,         // 予告と違うマスを攻撃する確率（%）。大きいほど予告を信用できない
  spawnRow: 1,     // 敵が現れる行（0=最上段）。大きいほど家に早く届く
  enemyHp: 2,      // 敵の耐久
  buildingHp: 2,   // 家1軒の耐久
  seed: 7          // 敵が出る位置の乱数の種。同じ値なら毎回同じ盤面になる
};
// ====================================================
const SIZE = 5, BROW = 4;           // 5×5。最下段(4行目)が家
const $ = id => document.getElementById(id);
const P = { ...DEFAULTS };          // 実験室のスライダーで書き換わる現在値
let G, sel = null, prev = null;

function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function fresh(){
  return { turn: 1, ap: P.actions, enemies: [], b: Array(SIZE).fill(P.buildingHp), kills: 0,
           surprise: 0, seen: 0, over: false, rs: rng(P.seed), rm: rng(P.seed + 99), id: 0, hitCells: new Set() };
}
function enemyAt(c, r){ return G.enemies.find(e => e.c === c && e.r === r); }
function spawn(){
  for (let i = 0; i < P.spawn; i++){
    for (let t = 0; t < 6; t++){
      const c = Math.floor(G.rs() * SIZE);
      const shown = G.rm() * 100 < P.telegraph;
      if (!enemyAt(c, P.spawnRow)){ G.enemies.push({ id: G.id++, c, r: P.spawnRow, hp: P.enemyHp, shown }); break; }
    }
  }
}
function say(s){ $('msg').textContent = s; }

function render(){
  $('turn').textContent = G.turn; $('turns').textContent = P.turns; $('ap').textContent = G.ap;
  $('bhp').textContent = G.b.reduce((a, b) => a + b, 0); $('kills').textContent = G.kills;
  const board = $('board'); board.replaceChildren();
  const targets = new Set(G.enemies.filter(e => e.shown).map(e => e.c + ',' + (e.r + 1)));
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++){
    const e = enemyAt(c, r), d = document.createElement('button');
    d.type = 'button'; d.className = 'cell';
    if (r === BROW){
      d.classList.add('bld'); const hp = G.b[c];
      if (hp <= 0) d.classList.add('dead');
      d.textContent = hp > 0 ? '家' : '×';
      if (hp > 0) d.insertAdjacentHTML('beforeend', '<span class="hp">' + '■'.repeat(hp) + '</span>');
      d.setAttribute('aria-label', (c + 1) + '列の家 耐久' + hp);
    } else if (e){
      d.classList.add('enemy'); if (sel === e.id) d.classList.add('sel');
      d.textContent = '敵';
      d.insertAdjacentHTML('beforeend', '<span class="hp">' + '■'.repeat(e.hp) + '</span><span class="tele ' + (e.shown ? '' : 'hid') + '">' + (e.shown ? '↓' : '?') + '</span>');
      d.setAttribute('aria-label', (c + 1) + '列' + (r + 1) + '行の敵 耐久' + e.hp + (e.shown ? ' 下を攻撃' : ' 攻撃先は不明'));
      d.addEventListener('click', () => { if (G.over) return; sel = sel === e.id ? null : e.id; render(); });
    } else d.setAttribute('aria-label', (c + 1) + '列' + (r + 1) + '行 空き');
    if (targets.has(c + ',' + r)) d.classList.add('target');
    if (G.hitCells.has(c + ',' + r)) d.classList.add('hit');
    board.append(d);
  }
  G.hitCells.clear();
  const has = G.enemies.some(x => x.id === sel), can = !G.over && G.ap > 0 && has;
  $('pushL').disabled = $('pushR').disabled = $('shoot').disabled = !can;
  $('endTurn').disabled = G.over;
  $('cur').textContent = '予告' + P.telegraph + '%・行動' + P.actions + '回・ハズレ' + P.miss + '%';
}

function act(kind){
  const e = G.enemies.find(x => x.id === sel); if (!e || G.ap <= 0 || G.over) return;
  if (kind === 'shoot'){
    e.hp--; G.hitCells.add(e.c + ',' + e.r);
    if (e.hp <= 0){ G.enemies = G.enemies.filter(x => x !== e); G.kills++; sel = null; say('撃破！攻撃は消えた。'); } else say('命中。耐久が減った。');
  } else {
    const nc = e.c + (kind === 'L' ? -1 : 1);
    if (nc < 0 || nc >= SIZE){ say('端なので押せない。行動は減らない。'); return; }
    const o = enemyAt(nc, e.r);
    if (o){
      e.hp--; o.hp--; G.hitCells.add(e.c + ',' + e.r); G.hitCells.add(o.c + ',' + o.r);
      for (const x of [e, o]) if (x.hp <= 0){ G.enemies = G.enemies.filter(y => y !== x); G.kills++; if (sel === x.id) sel = null; }
      say('敵どうしがぶつかり、両方にダメージ！');
    } else { e.c = nc; say('押した。攻撃先が横にずれた。'); }
  }
  G.ap--; render();
}

function endTurn(){
  if (G.over) return;
  let log = [], bad = 0;
  const order = [...G.enemies].sort((a, b) => b.r - a.r || a.c - b.c);
  for (const e of order){
    if (!G.enemies.includes(e)) continue;
    let tc = e.c, wobble = false;
    if (G.rm() * 100 < P.miss){ tc = e.c + (G.rm() < 0.5 ? -1 : 1); if (tc < 0 || tc >= SIZE) tc = e.c; wobble = tc !== e.c; }
    const tr = e.r + 1, o = enemyAt(tc, tr);
    if (tr === BROW){
      if (G.b[tc] > 0){ G.b[tc]--; bad++; G.hitCells.add(tc + ',' + tr); if (!e.shown || wobble) G.surprise++; else G.seen++; }
    } else if (o){ o.hp--; G.hitCells.add(tc + ',' + tr); if (o.hp <= 0){ G.enemies = G.enemies.filter(y => y !== o); G.kills++; } }
    if (tr < BROW && !enemyAt(e.c, tr) && G.enemies.includes(e)) e.r = tr;
  }
  if (G.turn >= P.turns){ finish(); return; }
  G.turn++; G.ap = P.actions; sel = null; spawn();
  say(bad ? '家が ' + bad + ' 回やられた。次の敵が現れた。' : '被害なし。次の敵が現れた。');
  render();
}

function finish(){
  G.over = true; render();
  const hp = G.b.reduce((a, b) => a + b, 0), max = SIZE * P.buildingHp, alive = G.b.filter(x => x > 0).length;
  const sum = '家の耐久 ' + hp + '/' + max + '・撃破 ' + G.kills + '・予告どおりの被害 ' + G.seen + '・不意の被害 ' + G.surprise;
  $('rTitle').textContent = hp >= max * 0.7 ? '防衛成功！' : hp >= max * 0.4 ? 'なんとか持ちこたえた' : '街が大きく壊れた';
  $('rText').textContent = sum + '（無事な家 ' + alive + '軒）。「不意の被害」は、予告が見えない・ハズレだったために防げなかった被害です。';
  $('result').style.display = 'block';
  prev = '予告' + P.telegraph + '%・行動' + P.actions + '・ハズレ' + P.miss + '% → ' + sum;
  $('prev').textContent = prev;
  say('終了。設定を変えて、同じ盤面でもう一度。');
}

function start(msg){
  G = fresh(); sel = null; spawn();
  $('result').style.display = 'none';
  say(msg || '敵をタップ → 押す／撃つ。紫の点線の家を守ろう。');
  render();
}
function sync(){
  P.telegraph = +$('tele').value; P.actions = +$('actions').value; P.miss = +$('miss').value;
  $('teleOut').value = P.telegraph + '%'; $('actionsOut').value = P.actions + '回'; $('missOut').value = P.miss + '%';
}
['tele', 'actions', 'miss'].forEach(id => $(id).addEventListener('input', () => { sync(); start('設定を変えて、最初からやり直した。'); }));
$('pushL').addEventListener('click', () => act('L'));
$('pushR').addEventListener('click', () => act('R'));
$('shoot').addEventListener('click', () => act('shoot'));
$('endTurn').addEventListener('click', endTurn);
$('again').addEventListener('click', () => start());

$('tele').value = DEFAULTS.telegraph; $('actions').value = DEFAULTS.actions; $('miss').value = DEFAULTS.miss;
sync(); start();
</script>
</body>
</html>
