<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星図に残る手がかり｜Game Design Lab DAY13</title>
<style>
:root{--ink:#16161a;--paper:#fff;--bg:#f4f3ee;--purple:#5b3df5;--line:#d8d6ce;--muted:#5b5a61}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:680px;margin:auto}.game{background:var(--paper);border:2px solid var(--ink);padding:18px;box-shadow:4px 4px 0 var(--ink)}h1{font-size:clamp(21px,5vw,28px);line-height:1.3;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 14px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{border:1px solid var(--line);padding:5px 10px;font-size:14px}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.site{min-height:70px;border:1.5px solid var(--ink);background:#fdfcf8;color:var(--ink);font:inherit;padding:8px 5px;cursor:pointer;touch-action:manipulation}.site[disabled]{opacity:.5;cursor:not-allowed}.site b{display:block}.site small{display:block;color:var(--muted)}button,.action{font:inherit;cursor:pointer;touch-action:manipulation}.primary{width:100%;border:2px solid var(--purple);background:var(--purple);color:white;padding:11px 14px;font-weight:700}.secondary{border:1px solid var(--ink);background:white;padding:8px 12px}.controls{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.control{margin:8px 0}.control label{display:flex;justify-content:space-between;font-size:14px}.control input{width:100%;accent-color:var(--purple);min-height:28px}.msg{background:#f1efff;border-left:4px solid var(--purple);padding:10px 12px;margin:12px 0;min-height:52px}.knowledge{font-size:14px;color:var(--muted);min-height:22px}.footer{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.footer button{flex:1;min-width:150px}.legend{font-size:13px;color:var(--muted)}@media(max-width:420px){body{padding:10px}.game{padding:13px}.map{gap:6px}.site{font-size:13px;min-height:66px}.pill{font-size:12px}}
</style>
</head>
<body><main class="wrap"><section class="game" aria-label="探索ゲーム">
<h1>星図に残る手がかり</h1><p class="sub">手がかりを集め、信号の発信源を見つけよう。知識は周回しても残ります。</p>
<div class="stats"><span class="pill">周回 <b id="cycle">1</b></span><span class="pill">残り時間 <b id="time">5</b></span><span class="pill">発見 <b id="found">0</b>/3</span></div>
<div class="map" id="map"></div><div class="msg" id="msg" role="status">「霧の星に信号が近い」と聞こえる。まず調査する星を選ぼう。</div>
<p class="knowledge" id="knowledge">記録：まだ手がかりはない</p>
<button class="primary" id="start">探索を開始</button>
<div class="controls">
<div class="control"><label for="hint">ヒントの強さ <b id="hintVal">2</b></label><input id="hint" type="range" min="1" max="3" value="2"></div>
<div class="control"><label for="duration">一周の行動回数 <b id="durationVal">5</b></label><input id="duration" type="range" min="3" max="7" value="5"></div>
<label><input id="carry" type="checkbox" checked> 発見した知識を次の周回へ持ち越す</label>
<p class="legend">設定は次の開始時に反映。星をタップして調査します。</p>
</div><div class="footer"><button class="secondary" id="replay">もう一度遊ぶ</button><button class="secondary" id="download">デモHTMLをダウンロード</button></div>
</section></main>
<script>
(()=>{const names=["霧の星","割れた月","青い惑星","赤い衛星","氷の彗星","古い観測所"];// 改造ポイント：知識（knowledge）が条件を満たすと、終点の星を調査できる。
let knowledge=new Set(),visited=new Set(),cycle=1,turns=0,maxTurns=5,running=false,won=false;const $=id=>document.getElementById(id),sites=$("map");
function render(){sites.innerHTML="";names.forEach((n,i)=>{const b=document.createElement("button");b.className="site";const locked=i===5&&knowledge.size<3;b.innerHTML="<b>"+n+"</b><small>"+(locked?"未解読":visited.has(i)?"今周回で調査済み":"タップして調査")+"</small>";b.disabled=!running||visited.has(i)||locked||turns>=maxTurns;b.onclick=()=>explore(i);sites.appendChild(b)});$("cycle").textContent=cycle;$("time").textContent=Math.max(0,maxTurns-turns);$("found").textContent=knowledge.size;$("knowledge").textContent="記録："+([...knowledge].map(i=>i===2?"信号は夜側に強く現れる":i===3?"観測所は信号が強い時に応答":"発信源は古い観測所の近く").join("／")||"まだ手がかりはない")}
function say(t){$("msg").textContent=t}
function explore(i){if(!running)return;turns++;visited.add(i);if(i===5&&knowledge.size>=3){running=false;won=true;say("発信源を発見！三つの記録をつなぎ、古い観測所にたどり着いた。")}else{let clue="ここに発信源はない。別の星を調べよう。";if(i===2){knowledge.add(2);clue="青い惑星の記録：信号は「夜側」に強く現れる。"}if(i===3){knowledge.add(3);clue="赤い衛星の記録：観測所は信号が強い時だけ応答する。"}if(i===4){knowledge.add(4);clue="氷の彗星の振動記録：発信源は「古い観測所」の近くにある。"}if(i===1)clue="割れた月の影が、遠くの信号を反射している。";// 改造ポイント：ヒント段階で手がかりの明確さを変える。
const h=+$("hint").value;say(h===1?"記録を追加した。別の場所の情報とつなげてみよう。":h===2?clue:clue+" 三つの記録がそろうと観測所を調査できる。");if(turns>=maxTurns){running=false;say("時間切れ。見つけた記録は残った。次の周回で調査先を選び直そう。")}}render()}
$("start").onclick=()=>{if(turns>=maxTurns||won){cycle++;visited.clear();turns=0}maxTurns=+$("duration").value;turns=0;visited.clear();running=true;won=false;if(!$("carry").checked)knowledge.clear();say("探索開始。三つの信号記録から発信源を探そう。");render()};
$("replay").onclick=()=>{$("start").click()};
$("hint").oninput=()=>$("hintVal").textContent=$("hint").value;
$("duration").oninput=()=>$("durationVal").textContent=$("duration").value;
$("download").onclick=()=>{const blob=new Blob(["<!doctype html>\n"+document.documentElement.outerHTML],{type:"text/html"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="GameDesignLab_Day013_2026-10-27.html";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("hintVal").textContent=$("hint").value;$("durationVal").textContent=$("duration").value;render()})();
</script></body></html>
