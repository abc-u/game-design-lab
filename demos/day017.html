<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f3ee">
<title>深海と食堂をつなぐ｜Game Design Lab DAY17</title>
<style>
:root{color-scheme:light;--ink:#16161a;--muted:#55545c;--paper:#fff;--bg:#f4f3ee;--line:#d8d6cf;--purple:#5b3df5;--sea:#dff4f3;--coral:#f8e5da;--gold:#f7efc9}*{box-sizing:border-box}[hidden]{display:none!important}html{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}main{max-width:720px;margin:auto;padding:14px 13px calc(24px + env(safe-area-inset-bottom))}header{padding:6px 2px 13px;border-bottom:1px solid var(--line)}.tag{margin:0;color:var(--purple);font-size:.74rem;font-weight:800;letter-spacing:.12em}h1{font-size:clamp(1.35rem,5vw,1.8rem);line-height:1.2;margin:5px 0}header p:last-child{margin:6px 0 0;color:var(--muted);font-size:.92rem}section{margin-top:13px;padding:13px;background:var(--paper);border:1px solid var(--line)}h2{font-size:1rem;margin:0 0 7px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.stat{padding:8px;background:#faf9f6;border:1px solid var(--line);min-width:0}.stat small{display:block;color:var(--muted);font-size:.72rem}.stat b{font-size:1.05rem;font-variant-numeric:tabular-nums}.loop{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin:10px 0}.loopbox{padding:10px;border:1px solid var(--line);min-height:86px}.loopbox.sea{background:var(--sea)}.loopbox.shop{background:var(--coral)}.loopbox strong{display:block;margin-bottom:4px}.arrow{align-self:center;color:var(--purple);font-weight:900;font-size:1.3rem}.controls{display:grid;gap:9px}.control{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center}.control label{font-weight:700;font-size:.87rem}.control output{font-size:.84rem;color:var(--purple);font-weight:800}.control input{grid-column:1/-1;width:100%;accent-color:var(--purple);min-height:24px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}button{font:inherit;font-weight:750;border:1px solid var(--ink);background:#fff;color:var(--ink);padding:10px 13px;min-height:44px;cursor:pointer}button.primary{background:var(--purple);color:#fff;border-color:var(--purple)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #9586ff;outline-offset:2px}.phase{padding:11px;background:#faf9f6;border:1px solid var(--line);margin-top:9px}.phase h3{font-size:.94rem;margin:0 0 5px}.phase p{margin:5px 0}.choices{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.choices button{flex:1 1 125px}.log{margin:8px 0 0;padding-left:19px;font-size:.85rem}.log li{margin:4px 0}.result{padding:10px;background:var(--gold);border:1px solid #e1d79d;margin-top:9px}.result strong{display:block}.foot{font-size:.77rem;color:var(--muted);margin:9px 1px 0}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:430px){main{padding-inline:10px}.loop{gap:5px}.loopbox{padding:8px;font-size:.86rem}.arrow{font-size:1.05rem}.stat{padding:7px}.stats{gap:5px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header><p class="tag">GAME DESIGN LAB / DAY 17</p><h1>深海と食堂をつなぐ</h1><p>潜水で集めた食材を夜の営業に使い、売上を次の装備へ戻そう。成果の受け渡しが、次の目標を生むか試します。</p></header>
<section aria-labelledby="statusTitle"><h2 id="statusTitle">4日間の経営記録</h2>
<div class="stats" aria-live="polite"><div class="stat"><small>日数</small><b id="dayStat">準備中</b></div><div class="stat"><small>資金</small><b id="moneyStat">0</b></div><div class="stat"><small>店の評判</small><b id="repStat">0</b></div></div>
<div class="loop"><div class="loopbox sea"><strong>昼｜潜水・収集</strong><span>魚を選ぶ → 食材が店へ</span></div><div class="arrow" aria-hidden="true">⇄</div><div class="loopbox shop"><strong>夜｜食堂・営業</strong><span>注文を満たす → 売上が装備へ</span></div></div>
<p class="muted" id="statusText">設定を決めて「1日目を始める」を押してください。</p></section>
<section aria-labelledby="labTitle"><h2 id="labTitle">実験設定</h2><div class="controls">
<div class="control"><label for="link">店の売上から装備へ戻す量</label><output id="linkOut" for="link">標準</output><input id="link" type="range" min="1" max="3" step="1" value="2"></div>
<div class="control"><label for="demand">一晩の注文数</label><output id="demandOut" for="demand">3件</output><input id="demand" type="range" min="2" max="4" step="1" value="3"></div>
</div><p class="foot">設定を変えると次のゲームに反映されます。開始後は変更できません。</p><div class="buttons"><button id="start" class="primary">1日目を始める</button><button id="reset" type="button">設定を戻す</button></div></section>
<section id="play" aria-labelledby="playTitle" hidden><h2 id="playTitle">今日の判断</h2><div class="phase" id="phase" aria-live="polite"></div><ol class="log" id="log" aria-label="これまでの結果"></ol><div id="final" class="result" hidden aria-live="polite"></div><div class="buttons"><button id="replay" hidden>設定を変えて再プレイ</button></div></section>
<p class="foot">操作はタップで進みます。4日間の結果を見たら、ループ接続の強さを変えてもう一度比べてください。</p>
</main>
<script>
'use strict';
// 改造ポイント1：この倍率で「夜の成果」が「次の昼の装備」へどれだけ戻るかを調整。
const LOOP_LINK={1:0.35,2:0.7,3:1.1};
// 改造ポイント2：営業日の注文数。需要と供給の釣り合いを変える。
const DAYS=4;
const FISH=[{name:'アジ',stock:2,value:3},{name:'タイ',stock:1,value:5},{name:'マグロ',stock:1,value:7}];
const $=id=>document.getElementById(id);
const link=$('link'), demand=$('demand'), start=$('start'), phase=$('phase'), play=$('play'), log=$('log');
let state;
function settingLabels(){ $('linkOut').textContent=['','弱','標準','強'][Number(link.value)]; $('demandOut').textContent=demand.value+'件'; }
link.addEventListener('input',settingLabels); demand.addEventListener('input',settingLabels); settingLabels();
function render(){ $('dayStat').textContent=state?`${Math.min(state.day,DAYS)}/${DAYS}日`:'準備中'; $('moneyStat').textContent=state?`${state.money}G`:'0'; $('repStat').textContent=state?`${state.rep}`:'0'; }
function begin(){state={day:1,money:8,rep:0,gear:1,stock:{},fishTotal:0,served:0,short:0,turn:'dive',link:Number(link.value),demand:Number(demand.value)};log.replaceChildren();play.hidden=false;start.disabled=true;link.disabled=true;demand.disabled=true;render();showDive();play.scrollIntoView({block:'nearest',behavior:'smooth'});}
function showDive(){state.turn='dive';const bonus=state.gear>=2?1:0;phase.innerHTML=`<h3>昼 ${state.day}｜どこまで潜る？</h3><p>装備Lv.${state.gear}。安全に獲るか、危険を引き受けて珍しい魚を狙うか選択。</p><div class="choices"><button data-site="reef">浅瀬でアジを2匹（安全）</button><button data-site="deep">深場でタイ1匹＋マグロ抽選（危険）</button></div><p class="foot">装備Lv.2以上なら深場でマグロを確実に獲得。</p>`;phase.querySelectorAll('[data-site]').forEach(b=>b.addEventListener('click',()=>dive(b.dataset.site,bonus)));}
function dive(site,bonus){if(site==='reef'){state.stock.アジ=(state.stock.アジ||0)+2+bonus;state.fishTotal+=2+bonus;logItem(`昼${state.day}：浅瀬でアジ${2+bonus}匹を確保。`);}else{state.stock.タイ=(state.stock.タイ||0)+1;state.fishTotal++;let caught=bonus||Math.random()<.55;if(caught){state.stock.マグロ=(state.stock.マグロ||0)+1;state.fishTotal++;}logItem(`昼${state.day}：深場でタイ1匹${caught?'とマグロ1匹':'を確保。マグロは見つからなかった。'}`);}showService();}
function showService(){state.turn='service';let available=Object.entries(state.stock).filter(([,n])=>n>0).map(([name])=>name);if(!available.length)available=['品切れ'];phase.innerHTML=`<h3>夜 ${state.day}｜注文に応える</h3><p>今夜の注文は${state.demand}件。食材を使って営業します。何を優先する？</p><div class="choices"><button data-menu="mix">おまかせ盛り（ある食材を優先）</button><button data-menu="premium">高級料理（タイ・マグロを優先）</button></div>`;phase.querySelectorAll('[data-menu]').forEach(b=>b.addEventListener('click',()=>serve(b.dataset.menu,available)));}
function serve(menu,available){let served=0,earned=0;for(let i=0;i<state.demand;i++){let choices=Object.entries(state.stock).filter(([,n])=>n>0).sort((a,b)=>{if(menu==='premium')return (FISH.find(f=>f.name===b[0]).value-FISH.find(f=>f.name===a[0]).value);return (FISH.find(f=>b[0]===b[0])?.value||0)-(FISH.find(f=>a[0]===a[0])?.value||0)});if(!choices.length)break;let [name]=choices[0];let f=FISH.find(x=>x.name===name);state.stock[name]--;served++;earned+=f.value;}
let missing=state.demand-served;state.rep+=Math.max(0,served-Math.ceil(missing/2));state.served+=served;state.short+=missing;let reinvest=Math.floor(earned*LOOP_LINK[state.link]);let before=state.gear;state.money+=reinvest;while(state.gear<3&&state.money>=state.gear*14){state.money-=state.gear*14;state.gear++;}let note=`夜${state.day}：${served}/${state.demand}件提供、売上${earned}G。売上から${reinvest}Gを再投資。`;logItem(note);if(state.day>=DAYS){finish();return;}state.day++;render();phase.innerHTML=`<h3>営業結果</h3><p>${note}</p><p>${state.gear>before?`装備がLv.${state.gear}になった。次の潜水で深場の成果が変わる。`:'装備は変化なし。次は食材を多く持ち帰るか、接続を強める必要がある。'}</p><button class="primary" id="next">${state.day}日目へ</button>`;$('next').addEventListener('click',()=>{state.stock={};render();showDive();});render();}
function logItem(text){const li=document.createElement('li');li.textContent=text;log.append(li);}
function finish(){state.turn='done';render();phase.innerHTML='<h3>4日間が終了</h3><p>結果を確認し、ループの接続を変えた時に「次にしたい行動」がどう変わるか考えてください。</p>';const success=state.rep>=7&&state.gear>=2;$('final').hidden=false;$('final').innerHTML=`<strong>${success?'食堂と深海の循環が育った':'営業か潜水の目標を見直そう'}</strong><span>評判 ${state.rep}｜累計提供 ${state.served}件｜品切れ ${state.short}件｜最終装備 Lv.${state.gear}｜資金 ${state.money}G</span>`;$('replay').hidden=false;start.disabled=false;start.textContent='もう一度始める';}
function reset(){state=null;phase.replaceChildren();play.hidden=true;log.replaceChildren();$('final').hidden=true;$('replay').hidden=true;start.disabled=false;start.textContent='1日目を始める';start.onclick=begin;link.disabled=false;demand.disabled=false;render();}
$('reset').addEventListener('click',reset);$('replay').addEventListener('click',()=>{reset();begin();});start.addEventListener('click',begin);
// 注文数が食材数を超えたときの不足も記録し、改造結果を比較できる。
render();
</script>
</body>
</html>
