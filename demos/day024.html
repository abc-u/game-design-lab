<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f3ee">
<title>ブースト・ストライク｜走って、当てて、ゴールへ</title>
<style>
:root{--ink:#16161a;--paper:#fff;--bg:#f4f3ee;--purple:#5b3df5;--muted:#52525b;--line:rgba(22,22,26,.2);--sans:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
main{max-width:720px;margin:0 auto;padding:16px} h1,h2,p{margin:0}
.eyebrow{font:700 12px ui-monospace,monospace;letter-spacing:.1em;color:var(--purple)}
h1{font-size:clamp(22px,5vw,30px);line-height:1.3;margin:3px 0 8px}.intro{color:var(--muted);font-size:14px}
.block{margin-top:16px;padding:14px;background:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px} label{display:block;font-size:13px;font-weight:700}
input{font:inherit} input[type=range]{display:block;width:100%;margin:7px 0 0;accent-color:var(--purple)} output{color:var(--purple);font-weight:800}
.arena{margin-top:16px;padding:14px;background:#fff;border:2px solid var(--ink)}
.hud{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:700}.score{font:700 16px ui-monospace,monospace;color:var(--purple)}.muted{color:var(--muted);font-size:13px}
canvas{display:block;width:100%;height:auto;max-width:550px;margin:12px auto 0;border:2px solid var(--ink);background:#e9f4e9;touch-action:none}
.controls{display:grid;grid-template-columns:repeat(3,minmax(64px,1fr));gap:8px;max-width:360px;margin:12px auto 0;justify-items:stretch}
button{font:inherit;touch-action:manipulation;cursor:pointer}.pad{min-height:48px;border:2px solid var(--ink);background:#fff;font-size:20px;font-weight:800;touch-action:none}.pad:active,.pad[aria-pressed=true]{background:#e8e3ff;color:var(--purple)}
.pad.blank{visibility:hidden}.boost{grid-column:1/4;min-height:48px;border:2px solid var(--ink);background:#ffe27a;font-weight:800;touch-action:none}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{min-height:46px;padding:8px 18px;border:2px solid var(--ink);background:var(--purple);color:white;font:700 14px ui-monospace,monospace}.btn.alt{background:white;color:var(--ink)}.btn:disabled{opacity:.45;cursor:not-allowed}
.result{min-height:50px;margin-top:12px;padding:10px 12px;border-left:4px solid var(--purple);background:#f3f0ff;font-size:14px}.result strong{display:block}
.help{margin-top:9px;color:var(--muted);font-size:12px}.download{display:block;margin:12px auto 0;border:0;background:none;color:#4030cf;text-decoration:underline;font:inherit;font-size:12px}
@media(max-width:520px){main{padding:11px}.block,.arena{padding:11px}.settings{grid-template-columns:1fr;gap:10px}.controls{gap:6px}.pad,.boost{min-height:46px}.actions .btn{flex:1 1 130px}}
</style>
</head>
<body>
<main>
  <p class="eyebrow">GAME DESIGN LAB / DAY 024</p>
  <h1>ブースト・ストライク</h1>
  <p class="intro">車を走らせてボールへ当てよう。接触した位置と勢いが、ボールの軌道を変えます。</p>
  <section class="block settings" aria-label="改造ラボ">
    <label for="goalSetting">ゴールの幅：<output id="goalValue">90</output>
      <input id="goalSetting" type="range" min="45" max="150" value="90">
    </label>
    <label for="boostSetting">ブーストの強さ：<output id="boostValue">1.0</output> 倍
      <input id="boostSetting" type="range" min="6" max="16" value="10">
    </label>
  </section>
  <section class="arena" aria-label="ゲーム">
    <div class="hud"><span id="stateLabel">準備完了</span><span class="score" id="scoreLabel">0 — 0</span><span id="timeLabel">45秒</span></div>
    <canvas id="field" width="550" height="320" aria-label="車を操作してボールをゴールへ運ぶゲームフィールド"></canvas>
    <div class="controls" aria-label="車の操作">
      <button class="pad blank" tabindex="-1" aria-hidden="true">　</button><button class="pad" data-dir="up" aria-label="上へ">↑</button><button class="pad blank" tabindex="-1" aria-hidden="true">　</button>
      <button class="pad" data-dir="left" aria-label="左へ">←</button><button class="pad" data-dir="down" aria-label="下へ">↓</button><button class="pad" data-dir="right" aria-label="右へ">→</button>
      <button class="boost" id="boostButton" aria-pressed="false">ブーストを押し続ける</button>
    </div>
    <div class="actions"><button class="btn" id="startButton">試合開始</button></div>
    <div class="result" id="result" aria-live="polite"><strong>目標</strong>3点先取、または45秒で終了。方向ボタンを押して車を動かします。</div>
    <p class="help">PCでは矢印キー／WASDで移動、ShiftまたはSpaceでブースト。得点後は配置が戻ります。</p>
  </section>
  <button class="download" id="downloadButton" type="button">デモHTMLを保存（単体で動作）</button>
</main>
<script>
(() => {
  const W=550,H=320, car={x:88,y:160,vx:0,vy:0,angle:0,r:16}, ball={x:250,y:160,vx:0,vy:0,r:11};
  const canvas=document.getElementById('field'),ctx=canvas.getContext('2d');
  const goalSetting=document.getElementById('goalSetting'),boostSetting=document.getElementById('boostSetting');
  const goalValue=document.getElementById('goalValue'),boostValue=document.getElementById('boostValue');
  const scoreLabel=document.getElementById('scoreLabel'),timeLabel=document.getElementById('timeLabel'),stateLabel=document.getElementById('stateLabel'),result=document.getElementById('result');
  const startButton=document.getElementById('startButton'),boostButton=document.getElementById('boostButton');
  const keys=new Set();let held=new Set(),boostHeld=false,running=false,score=0,timeLeft=45,touches=0,last=0,celebrate=0;
  // 改造ポイント：一定の加速・摩擦・衝突速度を調整すると、操作の学びやすさと上達幅が変わります。
  const tuning={acceleration:340,boostAcceleration:520,drag:0.986,maxSpeed:255,ballDrag:0.994,impact:190};
  function resetPositions(){car.x=88;car.y=160;car.vx=0;car.vy=0;car.angle=0;ball.x=250;ball.y=160;ball.vx=0;ball.vy=0;}
  function start(){score=0;timeLeft=45;touches=0;running=true;celebrate=0;resetPositions();startButton.textContent='最初から';stateLabel.textContent='試合中';result.innerHTML='<strong>ボールに当てよう</strong>動かす方向と接触位置を変えて、軌道を試します。';updateHud();}
  function end(won){running=false;stateLabel.textContent=won?'試合終了｜成功':'試合終了';result.innerHTML='<strong>'+(won?'3点先取！':'時間切れ')+'</strong>得点 '+score+' 点／ボール接触 '+touches+' 回。設定を変えて、違う狙いを試そう。';startButton.textContent='もう一度遊ぶ';}
  function updateHud(){scoreLabel.textContent='得点 '+score;timeLabel.textContent=Math.ceil(timeLeft)+'秒';}
  function direction(){let x=0,y=0;if(keys.has('left')||keys.has('a'))x--;if(keys.has('right')||keys.has('d'))x++;if(keys.has('up')||keys.has('w'))y--;if(keys.has('down')||keys.has('s'))y++;return {x,y};}
  function step(dt){if(!running)return;timeLeft-=dt;if(timeLeft<=0){timeLeft=0;updateHud();end(score>=3);return;}
    const d=direction(),mag=Math.hypot(d.x,d.y)||1,boost=boostHeld||keys.has('shift')||keys.has(' '),power=boost?Number(boostSetting.value)/10:1,accel=boost?tuning.boostAcceleration:tuning.acceleration;
    if(d.x||d.y){car.vx+=(d.x/mag)*accel*power*dt;car.vy+=(d.y/mag)*accel*power*dt;car.angle=Math.atan2(d.y,d.x);}
    const max=tuning.maxSpeed*(boost?1.34:1);let v=Math.hypot(car.vx,car.vy);if(v>max){car.vx*=max/v;car.vy*=max/v;}
    car.x+=car.vx*dt;car.y+=car.vy*dt;car.vx*=Math.pow(tuning.drag,dt*60);car.vy*=Math.pow(tuning.drag,dt*60);
    if(car.x<car.r){car.x=car.r;car.vx=Math.abs(car.vx)*.55}if(car.x>W-car.r){car.x=W-car.r;car.vx=-Math.abs(car.vx)*.55}
    if(car.y<car.r){car.y=car.r;car.vy=Math.abs(car.vy)*.55}if(car.y>H-car.r){car.y=H-car.r;car.vy=-Math.abs(car.vy)*.55}
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(tuning.ballDrag,dt*60);ball.vy*=Math.pow(tuning.ballDrag,dt*60);
    if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)*.82}if(ball.y>H-ball.r){ball.y=H-ball.r;ball.vy=-Math.abs(ball.vy)*.82}
    if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)*.82}
    // 車の速度とボールへの接触方向を軌道に反映し、入力の結果を読み取れるようにする。
    const dx=ball.x-car.x,dy=ball.y-car.y,dist=Math.hypot(dx,dy)||1,min=car.r+ball.r;
    if(dist<min){const nx=dx/dist,ny=dy/dist;ball.x=car.x+nx*(min+1);ball.y=car.y+ny*(min+1);const carSpeed=Math.hypot(car.vx,car.vy);const impulse=Math.max(tuning.impact,carSpeed*1.48);ball.vx+=nx*impulse+car.vx*.42;ball.vy+=ny*impulse+car.vy*.42;const bv=Math.hypot(ball.vx,ball.vy);if(bv>450){ball.vx*=450/bv;ball.vy*=450/bv;}touches++;result.innerHTML='<strong>接触！</strong>車の向き・速度がボールに伝わりました。次は当てる位置を変えてみよう。';}
    const gw=Number(goalSetting.value),cy=H/2;if(ball.x>=W-ball.r){if(Math.abs(ball.y-cy)<=gw/2){score++;celebrate=.8;result.innerHTML='<strong>ゴール！</strong> '+score+'点目。接触位置と勢いで狙いが変わります。';resetPositions();if(score>=3){updateHud();end(true);return;}}else{ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)*.86;result.innerHTML='<strong>枠に当たった</strong>ボールがゴール幅の外へ。次は高さを調整してみよう。';}}
    if(celebrate>0)celebrate-=dt;updateHud();
  }
  function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#e9f4e9';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(22,22,26,.28)';ctx.lineWidth=2;ctx.strokeRect(1,1,W-2,H-2);ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,42,0,Math.PI*2);ctx.stroke();
    const gw=Number(goalSetting.value);ctx.fillStyle='#5b3df5';ctx.fillRect(W-9,H/2-gw/2,9,gw);ctx.fillStyle='rgba(91,61,245,.12)';ctx.fillRect(W-28,H/2-gw/2,19,gw);ctx.fillStyle='#16161a';ctx.font='12px system-ui';ctx.fillText('GOAL',W-48,H/2-gw/2-7);
    ctx.save();ctx.translate(ball.x,ball.y);ctx.fillStyle='#fff';ctx.strokeStyle='#16161a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,ball.r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#16161a';ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.angle);ctx.fillStyle=boostHeld?'#ffad28':'#5b3df5';ctx.strokeStyle='#16161a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(19,0);ctx.lineTo(-12,-12);ctx.lineTo(-9,0);ctx.lineTo(-12,12);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
    if(celebrate>0){ctx.fillStyle='#16161a';ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.fillText('GOAL!',W/2,42);ctx.textAlign='start';}
  }
  function frame(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;step(dt);draw();requestAnimationFrame(frame);}
  document.querySelectorAll('[data-dir]').forEach(btn=>{const key=btn.dataset.dir;const down=e=>{e.preventDefault();keys.add(key);btn.setAttribute('aria-pressed','true');};const up=e=>{e.preventDefault();keys.delete(key);btn.setAttribute('aria-pressed','false');};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('lostpointercapture',up);});
  boostButton.addEventListener('pointerdown',e=>{e.preventDefault();boostHeld=true;boostButton.setAttribute('aria-pressed','true');});
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>boostButton.addEventListener(n,()=>{boostHeld=false;boostButton.setAttribute('aria-pressed','false');}));
  window.addEventListener('pointerup',()=>{keys.clear();document.querySelectorAll('[data-dir]').forEach(b=>b.setAttribute('aria-pressed','false'));boostHeld=false;boostButton.setAttribute('aria-pressed','false');});
  window.addEventListener('keydown',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};if(map[e.key]){keys.add(map[e.key]);e.preventDefault();}if(e.key==='Shift'||e.code==='Space')keys.add(e.key==='Shift'?'shift':' ');});
  window.addEventListener('keyup',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};if(map[e.key])keys.delete(map[e.key]);if(e.key==='Shift')keys.delete('shift');if(e.code==='Space')keys.delete(' ');});
  goalSetting.addEventListener('input',()=>goalValue.value=goalSetting.value);boostSetting.addEventListener('input',()=>boostValue.value=(Number(boostSetting.value)/10).toFixed(1));startButton.addEventListener('click',start);
  document.getElementById('downloadButton').addEventListener('click',()=>{const blob=new Blob(['<!doctype html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='GameDesignLab_Day024_2026-11-07.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});
  function fit(){const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}window.addEventListener('resize',fit);fit();draw();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
